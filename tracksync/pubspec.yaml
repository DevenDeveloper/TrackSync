name: tracksync
description: Driver tracking with a persistent offline queue and idempotent synchronization.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_bloc: ^9.1.1
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  sqflite: ^2.4.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
